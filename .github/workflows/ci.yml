name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build real production and test modules with the pinned SDK
        run: |
          make wasm wasm-test EMCC="docker run --rm -v $PWD:/src -w /src emscripten/emsdk:4.0.21 emcc"
          make tests/wasm_parity test-wasm-build
      - name: WASM browser controls and native parity
        timeout-minutes: 10
        run: |
          docker run --rm --ipc=host -v "$PWD:/work" -w /work mcr.microsoft.com/playwright:v1.64.1-noble bash -ec '
            npm install --prefix /tmp/rocket-browser playwright@1.64.1
            export NODE_PATH=/tmp/rocket-browser/node_modules
            for browser in chromium firefox webkit; do
              node tests/test_wasm_browser.cjs dist/wasm-test "$browser"
              node tests/test_wasm_browser.cjs dist/wasm "$browser"
            done
          '

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build
        run: make CC=gcc CFLAGS="-std=c99 -O2 -Wall -Wextra -Werror"

      - name: Test
        run: make test CC=gcc CFLAGS="-std=c99 -O2 -Wall -Wextra -Werror"

      - name: Optional WASM build contract (no SDK required)
        run: make test-wasm-build

      - name: Web server and integration tests
        run: make test-web CC=gcc CFLAGS="-std=c99 -O2 -Wall -Wextra -Werror"

      - name: Address and undefined-behavior sanitizers
        run: make test-sanitize CC=clang

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser control tests
        run: |
          npm install --prefix "$RUNNER_TEMP/rocket-browser" playwright@1.64.1 acorn@8.15.0
          "$RUNNER_TEMP/rocket-browser/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          export NODE_PATH="$RUNNER_TEMP/rocket-browser/node_modules"
          node tests/test_web_browser.cjs ./super-rocket-web chromium
          node tests/test_web_browser.cjs ./super-rocket-web firefox
          node tests/test_web_browser.cjs ./super-rocket-web webkit

      - name: Version
        run: |
          ./super-rocket --version
          make check-version CC=gcc
